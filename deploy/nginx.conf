# certbot --nginx adds the HTTPS server block and the HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name fruitbossng.com www.fruitbossng.com;

    client_max_body_size 10m;

    location /static/ {
        alias /srv/fruitboss/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/fruitboss/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/fruitboss/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
